[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "stt-bench-matrix"
version = "0.1.0"
description = "Cross-platform STT benchmarking tool"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "stt-bench-matrix contributors" }]
dependencies = [
  "mlx-whisper; platform_system == \"Darwin\"",
  "lightning-whisper-mlx; platform_system == \"Darwin\"",
  "pyperf",
  "huggingface-hub",
  "transformers>=5.4.0",
  "torch>=2.11.0",
  "librosa",
  "faster-whisper",
  "whisperx",
  "peft",
  "soundfile",
  "torchaudio>=2.11.0",
  "liquid-audio; python_version >= '3.12'",
]

[project.scripts]
stt-bench-matrix = "stt_bench_matrix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_bench_matrix"]

[dependency-groups]
dev = [
  "ty",
]

[tool.ty.src]
exclude = [
  "tools/nemo_runner/",
  "tools/parakeet_runner/",
  "tools/voxtral_runner/",
]
